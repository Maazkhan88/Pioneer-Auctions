packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
packageImportMethod: copy
injectWorkspacePackages: true
verifyDepsBeforeRun: false


allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - "@types/supertest@7.2.1"
  - quicktype-core@25.0.0

overrides:
  postcss: 8.5.10
